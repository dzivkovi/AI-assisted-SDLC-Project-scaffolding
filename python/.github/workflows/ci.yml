name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          if [ -s requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint
        run: |
          ruff format --check .
          ruff check .

      - name: Test
        # pytest exits 5 when it collects nothing, which is the correct state for a
        # fresh scaffold and not a failure. Every other non-zero code still fails.
        run: |
          set +e
          pytest --cov=src --cov-report=term-missing
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then echo "No tests collected yet (fresh scaffold)."; exit 0; fi
          exit "$code"
